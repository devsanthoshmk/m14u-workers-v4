name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      verify_release:
        description: Build and sign a release APK without publishing it
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_BUILD: ${{ github.ref_type == 'tag' || (github.ref == 'refs/heads/main' && inputs.verify_release) }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10.28.1

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: pnpm

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
        log-accepted-android-sdk-licenses: false

    - name: Check web app
      run: |
        pnpm lint
        pnpm typecheck
        pnpm test:ui
        pnpm test:catalog
        pnpm test:netlify

    - name: Build web assets and sync Capacitor
      env:
        VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      run: |
        pnpm build
        pnpm exec cap sync android

    - name: Test and build Android
      working-directory: android
      run: |
        if [[ "$RELEASE_BUILD" == true ]]; then
          ./gradlew :app:test :app:assembleRelease
        else
          ./gradlew :app:test :app:assembleDebug
        fi

    - name: Upload debug APK
      if: env.RELEASE_BUILD != 'true'
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error

    - name: Sign and verify release APK
      if: env.RELEASE_BUILD == 'true'
      env:
        APK_KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
        APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
      run: |
        if [[ "$GITHUB_REF_TYPE" == tag ]]; then
          bash scripts/sign-android-release.sh "$GITHUB_REF_NAME"
        else
          bash scripts/sign-android-release.sh --verify-only
        fi

    - name: Upload signed APK
      if: env.RELEASE_BUILD == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: m14u-release
        path: m14u.apk
        if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: m14u-release
    - name: Publish GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create "$GITHUB_REF_NAME" m14u.apk --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
