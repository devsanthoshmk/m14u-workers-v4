name: Sync and deploy JioSaavn search

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'jiosaavn-api/**'
      - '.github/workflows/jiosaavn.yml'

concurrency:
  group: jiosaavn-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: team_77ILB8M64NwJoweSmdODHF4j
      VERCEL_PROJECT_ID: prj_hiUfWODFRDUHdoq8geEVrAYflrNy
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Check upstream main
        id: sync
        run: |
          bash jiosaavn-api/sync-upstream.sh
          if ! git diff --quiet -- jiosaavn-api/upstream; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Test adapter
        if: steps.sync.outputs.changed == 'true' || github.event_name != 'schedule'
        run: docker run --rm --network none --read-only -v "$PWD/jiosaavn-api:/app:ro" -w /app node:24 node --test search.test.mjs
      - name: Deploy to Vercel
        if: steps.sync.outputs.changed == 'true' || github.event_name != 'schedule'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          : "${VERCEL_TOKEN:?Set the VERCEL_TOKEN Actions secret}"
          npx --yes vercel@54.4.1 deploy --cwd jiosaavn-api --prod --yes --token "$VERCEL_TOKEN"
          curl --retry 3 --retry-all-errors --max-time 20 -fsS "https://m14u-jiosaavn.vercel.app/api/search/songs?query=hello&limit=1&verify=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" | jq -e '.success == true and (.data.results | length == 1)'
      - name: Record deployed upstream revision
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- jiosaavn-api/upstream
          git commit -m "chore(jiosaavn): sync upstream $(cut -c1-12 jiosaavn-api/upstream/REVISION)"
          git push origin HEAD:main
