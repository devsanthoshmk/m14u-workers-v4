apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace = "dev.m14u.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "dev.m14u.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 4
        versionName "1.3.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        def escapeBuildConfigString = { String value ->
            value.replace('\\', '\\\\').replace('"', '\\"').replace('\r', '\\r').replace('\n', '\\n')
        }
        def resolverV2ManifestUrl = (project.findProperty('RESOLVER_V2_MANIFEST_URL') ?: System.getenv('RESOLVER_V2_MANIFEST_URL') ?: 'https://m14u.pages.dev/resolvers/v2/manifest.json').toString()
        def resolverV2PublicKeys = (project.findProperty('RESOLVER_V2_PUBLIC_KEYS') ?: System.getenv('RESOLVER_V2_PUBLIC_KEYS') ?: '').toString()
        def jioSaavnAudioOrigin = (project.findProperty('JIOSAAVN_AUDIO_ORIGIN') ?: System.getenv('JIOSAAVN_AUDIO_ORIGIN') ?: 'https://m14u-jiosaavn.onrender.com').toString()
        buildConfigField 'String', 'RESOLVER_V2_MANIFEST_URL', "\"${escapeBuildConfigString(resolverV2ManifestUrl)}\""
        buildConfigField 'String', 'RESOLVER_V2_PUBLIC_KEYS', "\"${escapeBuildConfigString(resolverV2PublicKeys)}\""
        buildConfigField 'String', 'JIOSAAVN_AUDIO_ORIGIN', "\"${escapeBuildConfigString(jioSaavnAudioOrigin)}\""
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        buildConfig = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
    sourceSets {
        def t3SpikeAssets = file('/tmp/opencode/m14u-t3-bundle')
        if (t3SpikeAssets.isDirectory()) {
            androidTest.assets.srcDirs += t3SpikeAssets
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.27.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.javascriptengine:javascriptengine:1.0.0'
    implementation 'com.google.code.gson:gson:2.13.1'
    implementation 'androidx.media3:media3-exoplayer:1.8.0'
    implementation 'androidx.media3:media3-session:1.8.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
