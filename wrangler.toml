# Workers Builds deploys this top-level Worker for the app's workers.dev API URL.
name = "m14u-api"
main = "src/backend/worker.ts"
compatibility_date = "2026-03-05"
compatibility_flags = ["nodejs_compat"]

[vars]
MUSIC_CATALOG = "open"

[observability]
enabled = true

[env.production]
routes = [{ pattern = "api.m14u.pages.dev" }]

[env.production.vars]
MUSIC_CATALOG = "open"
